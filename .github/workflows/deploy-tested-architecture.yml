name: Deploy Tested Architecture Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy-tested-architecture.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: road-to-rome-tested-pages
  cancel-in-progress: true

env:
  TESTED_SHA: bb2293c67f1a3121ab629ce2fb94699083f27ea0
  ARTIFACT_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-b34c-820a-8393-7ab276249621/raw?se=2026-10-04T07%3A27%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=f1c814e8-f924-5f99-8d59-a4127d84197e&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T04%3A21%3A33Z&ske=2026-10-05T04%3A21%3A33Z&sks=b&skv=2026-02-06&sig=qRhEd7X%2BySkT4kkRGiiP/IbzuBmQP4//0fkM4AeDENY%3D'

jobs:
  deploy-tested-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Download exact QA-tested browser build
        run: |
          set -euo pipefail
          curl -fL --retry 4 "$ARTIFACT_URL" -o /tmp/tested-build.zip
          mkdir -p /tmp/tested
          unzip -q /tmp/tested-build.zip -d /tmp/tested
          test -s /tmp/tested/build/web/index.html
          test -s /tmp/tested/build/web/index.js
          test -s /tmp/tested/build/web/index.wasm
          test -s /tmp/tested/build/web/index.pck

      - name: Replace Pages with tested build
        run: |
          set -euo pipefail
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/tested/build/web/. site/
          printf '%s\n' "$TESTED_SHA" > site/build.txt
          touch site/.nojekyll

      - name: Publish
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Publish QA-tested architecture build ${TESTED_SHA}" || exit 0
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin gh-pages
