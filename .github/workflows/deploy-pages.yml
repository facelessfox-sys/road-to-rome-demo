name: Publish Road to Rome Demo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-demo
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild validated index.pck from compiled patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, struct, subprocess, hashlib

          subprocess.run(['git', 'show', 'origin/gh-pages:index.pck'], check=True, stdout=open('/tmp/index-old.pck', 'wb'))
          old = Path('/tmp/index-old.pck').read_bytes()
          patch = zlib.decompress(base64.b64decode(Path('payload/index_pck_patch.b64').read_text().strip()))
          if patch[:2] != b'P1':
              raise SystemExit('Unexpected patch format')

          pos = 2
          out = bytearray()
          while True:
              op = patch[pos:pos+1]
              pos += 1
              if op == b'E':
                  break
              if op == b'C':
                  start, length = struct.unpack_from('<II', patch, pos)
                  pos += 8
                  out += old[start:start+length]
              elif op == b'L':
                  (length,) = struct.unpack_from('<I', patch, pos)
                  pos += 4
                  out += patch[pos:pos+length]
                  pos += length
              else:
                  raise SystemExit(f'Unknown patch opcode: {op!r}')

          expected = '610ed386e20510c0d588d369c2cac6a864319c35cc05ee99ac4bc1b14c79bfd5'
          actual = hashlib.sha256(out).hexdigest()
          if actual != expected:
              raise SystemExit(f'Patched PCK hash mismatch: {actual}')
          Path('/tmp/index-new.pck').write_bytes(out)
          print('Validated index.pck:', len(out), actual)
          PY

      - name: Publish fixed package to gh-pages
        run: |
          set -euo pipefail
          git checkout gh-pages
          cp /tmp/index-new.pck index.pck
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.pck
          if git diff --cached --quiet; then
            echo "No compiled package change to publish."
          else
            git commit -m "Publish validated Godot package"
            git push origin gh-pages
          fi
